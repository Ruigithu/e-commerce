server:
  port: ${PORT:8761}

eureka:
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    wait-time-in-ms-when-sync-empty: 5
    response-cache-update-interval-ms: 10000
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      # 修改为 Railway 环境变量
      defaultZone: https://${RAILWAY_PUBLIC_DOMAIN:localhost:8761}/eureka/
  instance:
    prefer-ip-address: true
    # 修改为 Railway 的环境变量
    hostname: ${RAILWAY_PUBLIC_DOMAIN:localhost}
    non-secure-port-enabled: false  # Railway 强制 HTTPS
    secure-port-enabled: true       # 启用 HTTPS