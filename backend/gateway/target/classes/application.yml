server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: user-service-route
          uri: lb://service-user
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1

        - id: product-service-route
          uri: lb://service-product
          predicates:
            - Path=/products/**
          filters:
            - StripPrefix=1

        - id: order-service-route
          uri: lb://service-order
          predicates:
            - Path=/orders/**
          filters:
            - StripPrefix=1

#        - id: pay-service-route
#          uri: lb://service-pay
#          predicates:
#            - Path=/pay/**
#          filters:
#            - StripPrefix=1

#        - id: review-service-route
#          uri: lb://service-review
#          predicates:
#            - Path=/reviews/**
#          filters:
#            - StripPrefix=1


        - id: login-route
          uri: lb://service-user  # 用户服务的负载均衡地址
          predicates:
            - Path=/users/login
          filters:
            - StripPrefix=1

        - id: signup-route
          uri: lb://service-user  # 用户服务的负载均衡地址
          predicates:
            - Path=/users/signup
          filters:
            - StripPrefix=1
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
              allowedOrigins:
                - "https://e-commerce-rui667.netlify.app"
              allowedMethods: "*"
              allowedHeaders: "*"
              allowCredentials: false
eureka:
  client:
    service-url:
      # 使用 Eureka 的 Railway 域名
      defaultZone: ${EUREKA_URL}/eureka/
  instance:
    prefer-ip-address: false
    hostname: ${RAILWAY_PUBLIC_DOMAIN:localhost}
    non-secure-port-enabled: false
    secure-port-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: TRACE
