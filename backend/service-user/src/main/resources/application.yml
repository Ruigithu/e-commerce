spring:
  application:
    name: service-user  # Eureka


  datasource:
      url: jdbc:postgresql://localhost:5432/service-user
      username: postgres
      password: 123456
      driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: true  # 启用 H2 控制台，默认访问路径为 /h2-console

  jpa:
    hibernate:
      ddl-auto: update  # 自动更新数据库模式（可以设置为 'create', 'validate', 'none' 等）
    show-sql: true  # 显示 SQL 查询语句

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Eureka

server:
  port: 8016