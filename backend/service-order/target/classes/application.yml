spring:
  application:
    name: service-order  # Eureka


  datasource:
    url: ${DATABASE_URL}
    #    localhost:5432/service-order
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
      console:
        enabled: true  # 启用 H2 控制台，默认访问路径为 /h2-console

  jpa:
      hibernate:
        ddl-auto: ${DDL_AUTO:update}
      show-sql: ${SHOW_SQL:false}
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

  cloud:
    openfeign:
      client:
        config:
          service-product:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full

eureka:
    client:
      service-url:
        defaultZone: ${EUREKA_URL}/eureka/
      fetch-registry: true
      register-with-eureka: true
    instance:
      prefer-ip-address: true
      hostname: ${RAILWAY_PUBLIC_DOMAIN:localhost}
      instance-id: ${spring.application.name}:${RAILWAY_PUBLIC_DOMAIN:localhost}:${PORT:8080}
      non-secure-port-enabled: false
      secure-port-enabled: true

server:
    port: ${PORT:8018}

logging:
  level:
    org.springframework.web.socket: DEBUG
    com.ruipeng.e_commrce.service_order.config.SecurityConfig: DEBUG